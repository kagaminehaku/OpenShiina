# Builds the players and, for a tag v*, publishes them as a GitHub release:
#   OpenShiina-<version>-windows-x64.zip       the Avalonia player for Windows
#   OpenShiina-<version>-linux-x64.tar.gz      the Avalonia player for Linux
#   OpenShiinaTools-<version>-windows-x64.zip  OpenShiina Tools (archives, translations) for Windows
#   OpenShiinaTools-<version>-linux-x64.tar.gz OpenShiina Tools for Linux
#   OpenShiina-<version>-android.apk           the Android player (CoreCLR: arm64, x64)
#   OpenShiina-<version>-switch.nro            the Switch player (native/, C++): homebrew, from hbmenu
#   OpenShiina-<version>-switch.nsp            the same as a title of its own (native/tools/nsp)
# The version is the tag's (v0.2.0 -> 0.2.0). Run by hand (Actions > Release > Run workflow),
# it only builds, and the files are kept as the run's artifacts.
#
# The APK is signed with the keystore in the repository's secrets when there is one:
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64
#   ANDROID_KEY_ALIAS         its key's alias
#   ANDROID_KEY_PASSWORD      the key's password (also used for the store)
# Without them it is signed with a debug key made for the run: fine to try, but an APK signed
# with another key cannot be installed over it. The APK's version code is the hour of the build
# (the Android project's ApplicationVersion), as for a build made by hand, so either installs
# over an older one.
#
# The NSP is packed with a console's keys, which are never in the repository: the secret
#   SWITCH_PROD_KEYS          prod.keys as Lockpick_RCM writes it (its text, as it is)
# Without it only the .nro is built.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The runner has a newer SDK too (11.0.100 on ubuntu-26.04), whose ReadyToRun compiler
      # refuses Android ("Target OS 'android' is not supported"): build with the .NET 10 SDK.
      - name: .NET 10 SDK
        run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/OpenShiina.Desktop -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=$env:VERSION -o out/desktop
          dotnet publish src/OpenShiina.Tools -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=$env:VERSION -o out/tools
          Remove-Item out/desktop/*.pdb, out/tools/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/desktop/* -DestinationPath "dist/OpenShiina-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path out/tools/* -DestinationPath "dist/OpenShiinaTools-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The runner has a newer SDK too (11.0.100 on ubuntu-26.04), whose ReadyToRun compiler
      # refuses Android ("Target OS 'android' is not supported"): build with the .NET 10 SDK.
      - name: .NET 10 SDK
        run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
      - name: Publish
        run: |
          dotnet publish src/OpenShiina.Desktop -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=$VERSION -o out/OpenShiina
          dotnet publish src/OpenShiina.Tools -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=$VERSION -o out/OpenShiinaTools
          rm -f out/OpenShiina/*.pdb out/OpenShiinaTools/*.pdb
          chmod +x out/OpenShiina/OpenShiina out/OpenShiinaTools/OpenShiinaTools
          mkdir -p dist
          tar -czf "dist/OpenShiina-$VERSION-linux-x64.tar.gz" -C out OpenShiina
          tar -czf "dist/OpenShiinaTools-$VERSION-linux-x64.tar.gz" -C out OpenShiinaTools
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The runner has a newer SDK too (11.0.100 on ubuntu-26.04), whose ReadyToRun compiler
      # refuses Android ("Target OS 'android' is not supported"): build with the .NET 10 SDK.
      - name: .NET 10 SDK
        run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
      - name: Android workload and SDK packages
        run: |
          dotnet workload install android
          dotnet build src/OpenShiina.Android -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true
      - name: Publish
        run: |
          signing=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            signing=(-p:AndroidKeyStore=true
                     -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
                     -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                     -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
                     -p:AndroidSigningStorePass=env:ANDROID_KEY_PASSWORD)
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi
          dotnet publish src/OpenShiina.Android -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:Version=$VERSION -p:ApplicationDisplayVersion=$VERSION \
            "${signing[@]}" -o out/android
          mkdir -p dist
          cp out/android/*-Signed.apk "dist/OpenShiina-$VERSION-android.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  switch:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SWITCH_PROD_KEYS: ${{ secrets.SWITCH_PROD_KEYS }}
    steps:
      # (git before the checkout, so that it is a repository; hacBrewPack is cloned too)
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git make gcc g++ libc6-dev cmake ninja-build ca-certificates
          dkp-pacman -Sy --noconfirm --needed libnx deko3d uam switch-tools switch-cmake switch-pkg-config switch-sdl2 switch-freetype
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native -B native/build-switch -G Ninja -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-switch
          mkdir -p dist
          cp native/build-switch/OpenShiina.nro "dist/OpenShiina-$VERSION-switch.nro"
      # The keys only in a file of the runner's temp folder for the packing, deleted after it
      - name: NSP
        if: env.SWITCH_PROD_KEYS != ''
        run: |
          printf '%s\n' "$SWITCH_PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          trap 'rm -f "$RUNNER_TEMP/prod.keys"' EXIT
          bash native/tools/nsp/build.sh "$RUNNER_TEMP/prod.keys" "$RUNNER_TEMP/nsp" native/build-switch "${VERSION%%-*}"
          cp "$RUNNER_TEMP"/nsp/hacbrewpack_nsp/*.nsp "dist/OpenShiina-$VERSION-switch.nsp"
      - name: No NSP
        if: env.SWITCH_PROD_KEYS == ''
        run: |
          echo "::warning::No SWITCH_PROD_KEYS secret: only the .nro is built"
      - uses: actions/upload-artifact@v4
        with:
          name: switch
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
